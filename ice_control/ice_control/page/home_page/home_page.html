<style>
	.home-page-main {
		padding: 0 !important;
		 
	}

	.home-page-shell {
		width: 100%;
	 
		padding: 24px;
	}

	.home-page-shell [data-home-section="welcome-banner"] {
		width: 100%;
	}

	.welcome-banner {
		position: relative;
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 32px;
		width: 100%;
		min-height: 218px;
		overflow: hidden;
		padding: 36px 40px;
		border: 1px solid rgba(255, 255, 255, 0.28);
		border-radius: 22px;
		background:
			radial-gradient(circle at 88% 18%, rgba(255, 255, 255, 0.25), transparent 28%),
			linear-gradient(120deg, #075985 0%, #0284c7 52%, #22b8cf 100%);
		box-shadow: 0 18px 42px rgba(3, 105, 161, 0.2);
		color: #fff;
	}

	.welcome-banner::before,
	.welcome-banner::after {
		position: absolute;
		content: "";
		border: 1px solid rgba(255, 255, 255, 0.16);
		border-radius: 999px;
	}

	.welcome-banner::before {
		top: -126px;
		right: -72px;
		width: 310px;
		height: 310px;
	}

	.welcome-banner::after {
		right: 96px;
		bottom: -174px;
		width: 268px;
		height: 268px;
	}

	.welcome-banner__identity,
	.welcome-banner__business {
		position: relative;
		z-index: 1;
	}

	.welcome-banner__identity {
		display: flex;
		align-items: center;
		gap: 22px;
		min-width: 0;
	}

	.welcome-banner__avatar {
		flex: 0 0 88px;
		width: 88px;
		height: 88px;
		padding: 4px;
		border: 1px solid rgba(255, 255, 255, 0.5);
		border-radius: 24px;
		background: rgba(255, 255, 255, 0.16);
		box-shadow: 0 10px 24px rgba(2, 72, 109, 0.22);
	}

	.welcome-banner__avatar-image,
	.welcome-banner__avatar-fallback {
		display: grid;
		width: 100%;
		height: 100%;
		place-items: center;
		border-radius: 19px;
	}

	.welcome-banner__avatar-image {
		object-fit: cover;
	}

	.welcome-banner__avatar-fallback {
		background: rgba(255, 255, 255, 0.94);
		color: #075985;
		font-size: 28px;
		font-weight: 700;
		letter-spacing: 0.04em;
	}

	.welcome-banner__avatar .hidden {
		display: none;
	}

	.welcome-banner__eyebrow {
		margin: 0 0 7px;
		color: rgba(255, 255, 255, 0.76);
		font-size: 12px;
		font-weight: 700;
		letter-spacing: 0.12em;
		text-transform: uppercase;
	}

	.welcome-banner__title {
		margin: 0;
		color: #fff;
		font-size: clamp(26px, 3vw, 40px);
		font-weight: 750;
		line-height: 1.15;
		letter-spacing: -0.025em;
	}

	.welcome-banner__subtitle {
		margin: 10px 0 0;
		color: rgba(255, 255, 255, 0.82);
		font-size: 14px;
	}

	.welcome-banner__business {
		flex: 0 1 430px;
		padding: 22px 24px;
		border: 1px solid rgba(255, 255, 255, 0.22);
		border-radius: 18px;
		background: rgba(2, 72, 109, 0.2);
		backdrop-filter: blur(10px);
	}

	.welcome-banner__business-heading {
		display: flex;
		align-items: center;
		gap: 12px;
		margin-bottom: 14px;
	}

	.welcome-banner__business-logo {
		width: 42px;
		height: 42px;
		padding: 4px;
		border-radius: 11px;
		background: #fff;
		object-fit: contain;
	}

	.welcome-banner__business-name {
		margin: 0;
		color: #fff;
		font-size: 17px;
		font-weight: 700;
		line-height: 1.3;
	}

	.welcome-banner__business-name-kh {
		margin: 2px 0 0;
		color: rgba(255, 255, 255, 0.75);
		font-size: 13px;
	}

	.welcome-banner__details {
		display: grid;
		grid-template-columns: repeat(2, minmax(0, 1fr));
		gap: 10px 18px;
	}

	.welcome-banner__detail {
		display: flex;
		align-items: flex-start;
		gap: 8px;
		min-width: 0;
		color: rgba(255, 255, 255, 0.84);
		font-size: 13px;
		line-height: 1.45;
	}

	.welcome-banner__detail--wide {
		grid-column: 1 / -1;
	}

	.welcome-banner__detail svg {
		flex: 0 0 16px;
		margin-top: 1px;
	}

	@media (max-width: 900px) {
		.home-page-shell { padding: 16px; }
		.welcome-banner {
			align-items: stretch;
			flex-direction: column;
			padding: 28px;
		}
		.welcome-banner__business { flex-basis: auto; }
	}

	@media (max-width: 520px) {
		.welcome-banner { padding: 22px; border-radius: 16px; }
		.welcome-banner__identity { align-items: flex-start; flex-direction: column; }
		.welcome-banner__avatar { flex-basis: 72px; width: 72px; height: 72px; }
		.welcome-banner__details { grid-template-columns: 1fr; }
		.welcome-banner__detail--wide { grid-column: auto; }
	}
</style>

<main class="home-page-shell">
	<section data-home-section="welcome-banner" aria-label="{{ __("Welcome") }}"></section>
</main>
