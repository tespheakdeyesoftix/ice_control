<style>
	.home-page-main {
		padding: 0 !important;
		 
	}

	.home-page-shell {
		width: 100%;
	 
		padding: 24px;
	}

	.home-page-shell [data-home-section="welcome-banner"] {
		width: 100%;
	}

	.welcome-banner {
		position: relative;
		display: flex;
		align-items: center;
		justify-content: space-between;
		gap: 32px;
		width: 100%;
		min-height: 218px;
		overflow: hidden;
		padding: 36px 40px;
		border: 1px solid rgba(14, 165, 233, 0.2);
		border-radius: 22px;
		background:
			radial-gradient(circle at 88% 18%, rgba(255, 255, 255, 0.88), transparent 30%),
			radial-gradient(circle at 8% 90%, rgba(56, 189, 248, 0.22), transparent 34%),
			linear-gradient(120deg, #f0f9ff 0%, #dbeafe 50%, #cffafe 100%);
		box-shadow: 0 18px 44px rgba(14, 116, 144, 0.12);
		color: #0f172a;
	}

	.welcome-banner::before,
	.welcome-banner::after {
		position: absolute;
		content: "";
		border: 1px solid rgba(14, 165, 233, 0.18);
		border-radius: 999px;
	}

	.welcome-banner::before {
		top: -126px;
		right: -72px;
		width: 310px;
		height: 310px;
	}

	.welcome-banner::after {
		right: 96px;
		bottom: -174px;
		width: 268px;
		height: 268px;
	}

	.welcome-banner__identity,
	.welcome-banner__business {
		position: relative;
		z-index: 1;
	}

	.welcome-banner__identity {
		display: flex;
		align-items: center;
		gap: 22px;
		min-width: 0;
	}

	.welcome-banner__avatar {
		flex: 0 0 88px;
		width: 88px;
		height: 88px;
		padding: 4px;
		border: 1px solid rgba(14, 116, 144, 0.2);
		border-radius: 24px;
		background: rgba(255, 255, 255, 0.72);
		box-shadow: 0 10px 24px rgba(14, 116, 144, 0.14);
	}

	.welcome-banner__avatar-image,
	.welcome-banner__avatar-fallback {
		display: grid;
		width: 100%;
		height: 100%;
		place-items: center;
		border-radius: 19px;
	}

	.welcome-banner__avatar-image {
		object-fit: cover;
	}

	.welcome-banner__avatar-fallback {
		background: #0284c7;
		color: #fff;
		font-size: 28px;
		font-weight: 700;
		letter-spacing: 0.04em;
	}

	.welcome-banner__avatar .hidden {
		display: none;
	}

	.welcome-banner__eyebrow {
		margin: 0 0 7px;
		color: #0369a1;
		font-size: 12px;
		font-weight: 700;
		letter-spacing: 0.12em;
		text-transform: uppercase;
	}

	.welcome-banner__title {
		margin: 0;
		color: #0f172a;
		font-size: clamp(26px, 3vw, 40px);
		font-weight: 750;
		line-height: 1.15;
		letter-spacing: -0.025em;
	}

	.welcome-banner__subtitle {
		margin: 10px 0 0;
		color: #2a2e34;
		font-size: 14px;
	}

	.welcome-banner__business {
		flex: 0 1 430px;
		padding: 22px 24px;
		border: 1px solid rgba(14, 165, 233, 0.18);
		border-radius: 18px;
		background: rgba(255, 255, 255, 0.66);
		box-shadow: 0 12px 28px rgba(14, 116, 144, 0.1);
		backdrop-filter: blur(10px);
	}

	.welcome-banner__business-heading {
		display: flex;
		align-items: center;
		gap: 12px;
		margin-bottom: 14px;
	}

	.welcome-banner__business-logo {
		width: 42px;
		height: 42px;
		padding: 4px;
		border-radius: 11px;
		background: #fff;
		object-fit: contain;
	}

	.welcome-banner__business-name {
		margin: 0;
		color: #0f172a;
		font-size: 17px;
		font-weight: 700;
		line-height: 1.3;
	}

	.welcome-banner__business-name-kh {
		margin: 2px 0 0;
		color: #475569;
		font-size: 13px;
	}

	.welcome-banner__details {
		display: grid;
		grid-template-columns: repeat(2, minmax(0, 1fr));
		gap: 10px 18px;
	}

	.welcome-banner__detail {
		display: flex;
		align-items: flex-start;
		gap: 8px;
		min-width: 0;
		color: #334155;
		font-size: 13px;
		line-height: 1.45;
	}

	.welcome-banner__detail--wide {
		grid-column: 1 / -1;
	}

	.welcome-banner__detail svg {
		flex: 0 0 16px;
		margin-top: 1px;
	}

	@media (max-width: 900px) {
		.home-page-shell { padding: 16px; }
		.welcome-banner {
			align-items: stretch;
			flex-direction: column;
			padding: 28px;
		}
		.welcome-banner__business { flex-basis: auto; }
	}

	@media (max-width: 520px) {
		.welcome-banner { padding: 22px; border-radius: 16px; }
		.welcome-banner__identity { align-items: flex-start; flex-direction: column; }
		.welcome-banner__avatar { flex-basis: 72px; width: 72px; height: 72px; }
		.welcome-banner__details { grid-template-columns: 1fr; }
		.welcome-banner__detail--wide { grid-column: auto; }
	}
	.home-page-shell [data-home-section="daily-summary"] { width:100%; margin-top:24px; }
	.daily-summary { --border:#dbe3ed; --muted:#475569; color:#0f172a; }
	.daily-summary__header { display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:16px; }
	.daily-summary__eyebrow { margin:0 0 4px; color:#0284c7; font-size:12px; font-weight:750; letter-spacing:.11em; text-transform:uppercase; }
	.daily-summary__title { margin:0; color:#0f172a; font-size:27px; font-weight:750; }
	.daily-summary__subtitle { margin:5px 0 0; color:var(--muted); font-size:14px; }
	.daily-summary__actions { display:flex; gap:8px; }
	.daily-summary__date { height:38px; padding:0 11px; border:1px solid var(--border); border-radius:10px; background:#fff; color:#334155; outline:none; }
	.daily-summary__date:focus { border-color:#38bdf8; box-shadow:0 0 0 3px rgba(56,189,248,.14); }
	.daily-summary__refresh { display:grid; width:38px; height:38px; padding:0; place-items:center; border:1px solid var(--border); border-radius:10px; background:#fff; color:#475569; cursor:pointer; }
	.daily-summary__refresh:hover { border-color:#7dd3fc; color:#0284c7; }
	.daily-summary__refresh svg { width:17px; height:17px; }
	.daily-summary__overview { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
	.summary-kpi { position:relative; overflow:hidden; padding:18px; border:1px solid var(--border); border-radius:15px; background:#fff; box-shadow:0 5px 18px rgba(15,23,42,.045); }
	.summary-kpi:after { position:absolute; top:0; right:0; width:58px; height:58px; border-radius:0 0 0 58px; background:#e0f2fe; content:""; }
	.summary-kpi--pending:after { background:#fef3c7; } .summary-kpi--deleted:after { background:#fee2e2; }
	.summary-kpi__label { margin:0 0 8px; color:var(--muted); font-size:13px; font-weight:650; }
	.summary-kpi__value { position:relative; z-index:1; margin:0; color:#0f172a; font-size:clamp(23px,2.4vw,31px); font-weight:780; font-variant-numeric:tabular-nums; }
	.summary-kpi__hint { display:flex; flex-wrap:wrap; gap:3px 10px; margin:6px 0 0; color:#475569; font-size:12px; font-weight:500; }
	.daily-summary__outlets { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
	.daily-summary__outlets--single { grid-template-columns:minmax(0,1fr); }
	.outlet-summary { min-width:0; overflow:hidden; border:1px solid var(--border); border-radius:17px; background:#fff; box-shadow:0 7px 24px rgba(15,23,42,.055); }
	.outlet-summary__header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 20px; border-bottom:1px solid #f1f5f9; background:linear-gradient(120deg,#f8fafc,#f0f9ff); }
	.outlet-summary__identity { display:flex; align-items:center; gap:11px; min-width:0; }
	.outlet-summary__icon { display:grid; flex:0 0 38px; width:38px; height:38px; place-items:center; border-radius:11px; background:#0284c7; color:#fff; }
	.outlet-summary__icon svg { width:20px; height:20px; }
	.outlet-summary__name { margin:0; overflow:hidden; color:#0f172a; font-size:19px; font-weight:750; text-overflow:ellipsis; white-space:nowrap; }
	.outlet-summary__caption { margin:3px 0 0; color:var(--muted); font-size:12px; }
	.outlet-summary__badge { flex:0 0 auto; padding:5px 9px; border-radius:99px; background:#dcfce7; color:#15803d; font-size:12px; font-weight:700; }
	.outlet-summary__metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; background:#f1f5f9; }
	.outlet-metric { min-width:0; padding:15px 16px; background:#fff; }
	.outlet-metric__label { margin:0 0 6px; color:var(--muted); font-size:12px; }
	.outlet-metric__value { margin:0; overflow:hidden; color:#0f172a; font-size:20px; font-weight:750; text-overflow:ellipsis; white-space:nowrap; }
	.outlet-metric__value--pending { color:#b45309; } .outlet-metric__value--deleted { color:#dc2626; }
	.outlet-metric__meta { margin:4px 0 0; overflow:hidden; color:#64748b; font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
	.outlet-summary__table-wrap { overflow-x:auto; }
	.outlet-summary__table { width:100%; min-width:690px; border-collapse:collapse; font-size:13px; }
	.outlet-summary__table th { padding:12px; border-bottom:1px solid var(--border); background:#f8fafc; color:var(--muted); font-size:13px; font-weight:700; text-align:right; text-transform:uppercase; }
	.outlet-summary__table td { padding:12px; border-bottom:1px solid #f1f5f9; color:#1e293b; text-align:right; white-space:nowrap; }
	.outlet-summary__table th:first-child,.outlet-summary__table td:first-child { padding-left:20px; text-align:left; }
	.outlet-summary__table tbody tr:hover { background:#f8fafc; }
	.product-cell { min-width:190px; } .product-cell__name { display:block; color:#0f172a; font-weight:650; white-space:normal; }
	.product-cell__code { display:block; margin-top:2px; color:#64748b; font-size:11px; }
	.quantity--free { color:#7c3aed!important; } .quantity--return { color:#dc2626!important; } .quantity--total { color:#0284c7!important; font-weight:750; } .amount-cell { color:#0f172a!important; font-weight:700; }
	.daily-summary__state { display:grid; min-height:220px; place-items:center; border:1px dashed #cbd5e1; border-radius:17px; background:#f8fafc; color:var(--muted); text-align:center; }
	.daily-summary__state-content { max-width:390px; padding:28px; } .daily-summary__state-title { margin:0; color:#334155; font-size:15px; font-weight:700; } .daily-summary__state-message { margin:5px 0 0; font-size:12px; }
	.daily-summary__skeleton { height:220px; border-radius:17px; background:linear-gradient(90deg,#f1f5f9 25%,#f8fafc 37%,#f1f5f9 63%); background-size:400% 100%; animation:summary-shimmer 1.35s ease infinite; }
	@keyframes summary-shimmer { 0% { background-position:100% 0; } 100% { background-position:0 0; } }
	@media (max-width:900px) { .daily-summary__overview { grid-template-columns:repeat(2,minmax(0,1fr)); } .daily-summary__outlets { grid-template-columns:1fr; } }
	@media (max-width:520px) { .daily-summary__header { align-items:stretch; flex-direction:column; } .daily-summary__actions { width:100%; } .daily-summary__date { flex:1; min-width:0; } .daily-summary__overview { gap:8px; } .summary-kpi { padding:14px; } .summary-kpi__value { font-size:22px; } .outlet-summary__metrics { grid-template-columns:1fr 1fr; } .outlet-metric:last-child { grid-column:1/-1; } }
</style>

<main class="home-page-shell">
	<section data-home-section="welcome-banner" aria-label="{{ __("Welcome") }}"></section>
	<section data-home-section="daily-summary" aria-live="polite"></section>
</main>
