<style>
	.ice-report-catalog {
		min-height: calc(100vh - 110px);
		padding: 24px;
		background: var(--subtle-fg);
	}
	.ice-report-catalog__header {
		display: flex; align-items: end; justify-content: space-between; gap: 16px;
		max-width: 1400px; margin: 0 auto 20px;
	}
	.ice-report-catalog__title { margin: 0 0 4px; font-size: var(--text-xl); font-weight: 700; }
	.ice-report-catalog__description { margin: 0; color: var(--text-muted); }
	.ice-report-search {
		position: relative; width: min(100%, 680px); margin: 0 auto 24px;
	}
	.ice-report-search__icon {
		position: absolute; top: 50%; left: 17px; width: 15px; height: 15px;
		border: 1.8px solid var(--text-muted); border-radius: 50%;
		transform: translateY(-56%); pointer-events: none;
	}
	.ice-report-search__icon::after {
		content: ""; position: absolute; right: -5px; bottom: -3px;
		width: 7px; height: 1.8px; border-radius: 2px;
		background: var(--text-muted); transform: rotate(45deg);
	}
	.ice-report-search__input {
		width: 100%; height: 48px; padding: 0 48px;
		border: 1px solid var(--border-color); border-radius: 14px;
		background: var(--card-bg); color: var(--text-color);
		box-shadow: var(--shadow-sm); font-size: var(--text-md);
		transition: border-color 120ms ease, box-shadow 120ms ease;
	}
	.ice-report-search__input::placeholder { color: var(--text-light); }
	.ice-report-search__input::-webkit-search-cancel-button { appearance: none; }
	.ice-report-search__input:focus {
		outline: none; border-color: var(--blue-500);
		box-shadow: 0 0 0 3px var(--blue-100), var(--shadow-sm);
	}
	.ice-report-search__input:disabled { cursor: wait; opacity: 0.7; }
	.ice-report-search__clear {
		position: absolute; top: 50%; right: 10px; display: grid;
		width: 30px; height: 30px; place-items: center; padding: 0;
		border: 0; border-radius: 50%; background: transparent;
		color: var(--text-muted); font-size: 20px; line-height: 1;
		cursor: pointer; transform: translateY(-50%);
	}
	.ice-report-search__clear:hover { background: var(--control-bg); color: var(--text-color); }
	.ice-report-search__clear[hidden] { display: none; }
	.ice-report-catalog__status {
		display: grid; min-height: 220px; place-items: center; padding: 32px;
		max-width: 1400px; margin: 0 auto;
		border: 1px dashed var(--border-color); border-radius: 16px;
		background: var(--card-bg); color: var(--text-muted); text-align: center;
	}
	.ice-report-catalog__status[hidden] { display: none; }
	.ice-report-groups {
		display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
		max-width: 1400px; margin: 0 auto; align-items: start; gap: 22px;
	}
	.ice-report-card {
		position: relative; overflow: hidden;
		border: 1px solid var(--border-color); border-radius: 16px;
		background: var(--card-bg);
		box-shadow: 0 4px 14px rgba(17, 24, 39, 0.06);
		transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
	}
	.ice-report-card::before {
		content: ""; position: absolute; inset: 0 0 auto; z-index: 1; height: 3px;
		background: linear-gradient(90deg, var(--blue-500), var(--cyan-500, var(--blue-400)));
	}
	.ice-report-card:hover {
		border-color: var(--blue-200);
		box-shadow: 0 10px 28px rgba(17, 24, 39, 0.1);
		transform: translateY(-2px);
	}
	.ice-report-card__header {
		display: flex; align-items: center; justify-content: space-between; gap: 12px;
		padding: 18px 20px 16px; border-bottom: 1px solid var(--border-color);
		background: linear-gradient(135deg, var(--blue-50, #eef6ff), var(--card-bg) 75%);
	}
	.ice-report-card__title {
		display: flex; align-items: center; gap: 11px;
		margin: 0; color: var(--text-color); font-size: var(--text-md); font-weight: 650;
	}
	.ice-report-card__title::before {
		content: ""; width: 10px; height: 10px; flex: 0 0 10px;
		border-radius: 3px; background: var(--blue-500);
		box-shadow: 0 0 0 4px var(--blue-100);
	}
	.ice-report-card__count {
		flex: 0 0 auto; min-width: 30px; padding: 3px 9px;
		border: 1px solid var(--blue-200); border-radius: 999px;
		background: var(--blue-100); color: var(--blue-700);
		font-size: var(--text-xs); font-weight: 600; text-align: center;
	}
	.ice-report-card__items { display: grid; gap: 4px; padding: 10px; }
	.ice-report-card__item {
		position: relative; width: 100%; min-height: 46px; padding: 11px 38px 11px 14px;
		border: 1px solid transparent; border-radius: 10px; background: transparent;
		color: var(--text-color); line-height: 1.45; text-align: left; cursor: pointer;
		transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
	}
	.ice-report-card__item::after {
		content: ""; position: absolute; top: 50%; right: 15px;
		width: 7px; height: 7px; border-top: 1.5px solid currentColor;
		border-right: 1.5px solid currentColor; transform: translateY(-50%) rotate(45deg);
		color: var(--text-muted);
	}
	.ice-report-card__item:hover,
	.ice-report-card__item:focus-visible {
		outline: none; border-color: var(--blue-100);
		background: var(--blue-50); color: var(--blue-700);
	}
	@media (prefers-reduced-motion: reduce) {
		.ice-report-card { transition: none; }
	}
	.ice-report-dialog .modal-dialog { width: calc(100vw - 32px) !important; max-width: 1600px !important; }
	.ice-report-dialog .modal-body { padding: 0; overflow: hidden; }
	.ice-report-dialog .form-section,
	.ice-report-dialog .section-body,
	.ice-report-dialog .frappe-control[data-fieldname="report_viewer"] { margin: 0; padding: 0; }
	.ice-report-dialog__frame {
		display: block; width: 100%; height: calc(100vh - 125px);
		min-height: 520px; border: 0; background: #fff;
	}
	@media (max-width: 767px) {
		.ice-report-catalog { padding: 16px 12px; }
		.ice-report-catalog__header { margin-bottom: 16px; }
		.ice-report-search { margin-bottom: 18px; }
		.ice-report-groups { grid-template-columns: 1fr; }
		.ice-report-dialog .modal-dialog { width: calc(100vw - 12px) !important; margin: 6px auto; }
		.ice-report-dialog__frame { height: calc(100vh - 90px); min-height: 400px; }
	}
</style>

<section class="ice-report-catalog">
	<header class="ice-report-catalog__header">
		<div>
			<h2 class="ice-report-catalog__title">{{ __("Reports") }}</h2>
			<p class="ice-report-catalog__description">{{ __("Choose a report to open it in the report viewer.") }}</p>
		</div>
	</header>
	<div class="ice-report-search" role="search">
		<span class="ice-report-search__icon" aria-hidden="true"></span>
		<input class="ice-report-search__input" data-report-search type="search"
			placeholder="{{ __("Search reports or groups...") }}"
			aria-label="{{ __("Search reports") }}" autocomplete="off" disabled>
		<button class="ice-report-search__clear" data-report-search-clear type="button"
			aria-label="{{ __("Clear search") }}" title="{{ __("Clear search") }}" hidden>&times;</button>
	</div>
	<div class="ice-report-catalog__status" data-report-status role="status">{{ __("Loading reports...") }}</div>
	<div class="ice-report-groups" data-report-groups></div>
</section>
